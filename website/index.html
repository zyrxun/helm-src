<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helm — Coming soon.</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml" href="helm-mark-gold.svg" />
  <style>
    #helm-demo-section {
      width: 100%;
      height: 100vh;
      background: #0A1628;
      overflow: hidden;
      position: relative;
    }
    #helm-demo-section iframe {
      position: absolute;
      top: -60px;
      left: 0;
      width: 100%;
      height: calc(100% + 140px);
      border: none;
      display: block;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    #helm-demo-section iframe.visible {
      opacity: 1;
    }
    #helm-scroll-prompt {
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .helm-prompt-text {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      color: var(--helm-fog, #C8C4BC);
      letter-spacing: 0.08em;
      opacity: 0.6;
    }
    .helm-prompt-arrow {
      animation: helm-bounce 1.6s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes helm-bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(4px); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Demo animation section -->
  <div id="helm-demo-section">
    <iframe id="helm-demo-frame" data-src="Helm Launch Video (standalone).html"></iframe>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="env,react" src="wheel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="prelaunch-app.jsx"></script>

  <script>
    (function() {
      const frame = document.getElementById('helm-demo-frame');
      if (!frame) return;

      const observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            frame.classList.remove('visible');
            frame.src = '';
            // Wait for src reset to flush, then load fresh
            setTimeout(function() {
              frame.onload = function() {
                // Give the animation a moment to render frame 0 before revealing
                setTimeout(function() { frame.classList.add('visible'); }, 300);
                frame.onload = null;
              };
              frame.src = frame.getAttribute('data-src');
            }, 50);
          } else {
            frame.classList.remove('visible');
            frame.src = '';
          }
        });
      }, { threshold: 0.2 });

      observer.observe(frame);
    })();

    (function() {
      const prompt = document.getElementById('helm-scroll-prompt');
      if (!prompt) return;
      function onScroll() {
        if (window.scrollY > 80) {
          prompt.style.opacity = '0';
          window.removeEventListener('scroll', onScroll);
        }
      }
      window.addEventListener('scroll', onScroll, { passive: true });
    })();
  </script>
</body>
</html>
