  # InstallerSwitches block is needed.
  - Architecture: x64
    InstallerUrl: https://updates.get-helm.app/Helm-1.0.3-x64-setup.exe
    InstallerSha256: C6CC85BC6A04AB0F9AD319F1503D267AFB89C4A03C031CE5F5F57E27D4127869

